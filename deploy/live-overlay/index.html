<!doctype html> <html lang="en"> <head> <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rowdy Room Live Overlay</title> <style> *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}body{font-family:Inter,Arial,sans-serif;color:white}#overlay{position:relative;width:100vw;height:100vh;pointer-events:none}.brand{position:absolute;top:5%;left:4%;padding:.45em .65em;background:rgba(16,5,36,.92);border:2px solid #5de5f1;border-radius:.6em;font-size:clamp(18px,2.7vw,32px);font-weight:900;letter-spacing:.04em}.brand b{color:#5de5f1}.status{position:absolute;top:5%;right:4%;padding:.45em .65em;background:rgba(10,33,23,.92);border-radius:100px;color:#99f6c1;font-size:clamp(12px,1.5vw,18px);font-weight:800}.status.offline{color:#fde68a;background:rgba(44,21,5,.92)}.stage{position:absolute;left:4%;right:4%;top:2%;bottom:2%;display:grid;grid-template-rows:auto 1fr auto 1fr;gap:0}.row,.leaders{display:grid;grid-template-columns:1fr 1fr;gap:.6em}.card{min-width:0;padding:.7em .8em;background:rgba(14,5,31,.92);border:1px solid #8151d6;border-left:.3em solid #5de5f1;border-radius:.7em;box-shadow:0 3px 22px #0009}.standings{border-left-color:#facc15}.label{color:#5de5f1;font-size:clamp(14px,2vw,24px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.standings .label,.leader strong{color:#facc15}.name{font-size:clamp(20px,3.4vw,40px);font-weight:900;line-height:1.2}.song,.leader,.foot{font-size:clamp(13px,2vw,24px);color:#e1d4f2}.name,.song,.leader{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.leader{color:white;font-weight:800}.leader small{color:#e1d4f2;font-size:.75em}.foot{font-size:clamp(11px,1.5vw,18px);margin-top:.2em} .viewer-help{position:absolute;left:4%;right:4%;bottom:2%;background:rgba(14,5,31,.94);border:1px solid #5de5f1;border-radius:.7em;padding:.6em .8em;font-size:clamp(12px,1.8vw,22px);line-height:1.25}.viewer-help p{margin:0;min-height:2.5em;font-weight:800}.viewer-help .url{color:#75edf4;font-weight:800;font-size:.85em;margin-top:.3em}
/* Compact overlay: singer names and one-line live leaders. */
.standings{display:flex;align-items:center;gap:1em;min-width:0;padding:.55em .8em}.standings>.label{flex:0 0 auto;font-size:clamp(12px,1.8vw,21px);letter-spacing:.04em;white-space:nowrap}.standings .leaders{display:flex;align-items:center;gap:1.2em;flex:1;min-width:0}.standings .leader{flex:1;min-width:0;font-size:clamp(14px,2.2vw,26px)}.standings .leader small{font-size:1em;color:#facc15}.standings .leader{display:flex;align-items:baseline;gap:.25em;overflow:hidden}.standings .leader strong,.standings .leader small{flex:0 0 auto}.leader-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.standings .leader:empty{display:none}
.stage>.standings{grid-row:1}.stage>.row{grid-row:3}
#votingClock[hidden]{display:none!important}#votingClock{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);padding:.55em 1.2em;text-align:center;border:2px solid #5de5f1;border-radius:16px;background:rgba(14,5,31,.96);box-shadow:0 3px 22px #0009;min-width:32%}#votingClock .label{font-size:clamp(14px,2vw,24px)}#votingClockValue{font-size:clamp(30px,6vw,70px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}#votingClock.expired{border-color:#facc15}#votingClock.expired .label{color:#facc15}
</style></head> <body><main id="overlay"><section class="stage"><div class="row"><div class="card"><div class="label">Now singing</div><div id="now" class="name">Between singers</div></div><div class="card"><div id="nextLabel" class="label">Up Next</div><div id="next" class="name">Queue open</div></div></div><div class="card standings"><div class="label">Live vote leaders</div><div class="leaders"><div id="first" class="leader">No scores yet</div><div id="second" class="leader"></div></div></div></section><aside id="votingClock" hidden><div class="label">Voting time</div><div id="votingClockValue">1:00</div></aside></main> <script> 'use strict';const $=id=>document.getElementById(id),set=(id,v)=>{$(id).textContent=v};function nameOf(r){try{let a=Array.isArray(r.singer_names_json)?r.singer_names_json:JSON.parse(r.singer_names_json||'[]');if(a.length)return a.map(String).join(' + ')}catch(e){}return String(r.tiktok_username||'Singer')}async function get(path){let r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(!d.ok)throw Error('Unavailable');return d}let upcoming=[],upcomingIndex=0;function showUpcoming(){set('nextLabel',['Up Next','Up 2nd','Up 3rd'][upcomingIndex]||'Up Next');set('next',upcoming.length?upcoming[upcomingIndex]:'Queue open')}function updateUpcoming(waiting){let names=waiting.slice(0,3).map(nameOf);if(JSON.stringify(names)!==JSON.stringify(upcoming)){upcoming=names;upcomingIndex=0}if(upcomingIndex>=upcoming.length)upcomingIndex=0;showUpcoming()}setInterval(()=>{if(upcoming.length>1){upcomingIndex=(upcomingIndex+1)%upcoming.length;showUpcoming()}},5000);let busy=false;async function refresh(){if(busy)return;busy=true;try{let[q,s]=await Promise.all([get('/api/queue'),get('/api/vote/live-standings')]);let rows=Array.isArray(q.queue)?q.queue:[],current=rows.find(x=>x.status==='current'||x.status==='performing'),waiting=rows.filter(x=>['next','on_deck','waiting','queued'].includes(x.status)).sort((a,b)=>Number(a.position||0)-Number(b.position||0));set('now',current?nameOf(current):'Between singers');updateUpcoming(waiting);let leaders=Array.isArray(s.standings)?s.standings.slice(0,2):[];for(let i=0;i<2;i++){let el=$(i?'second':'first'),v=leaders[i];el.replaceChildren();if(!v){el.textContent=i?'':'No scores yet';continue}let rank=document.createElement('strong');rank.textContent=(i+1)+'. ';let detail=document.createElement('small');detail.textContent=' '+Number(v.avg_rating||0).toFixed(2)+'/5';let singer=document.createElement('span');singer.className='leader-name';singer.textContent=String(v.singer_name||'Singer');el.append(rank,singer,detail)}}catch(e){set('now','Data unavailable');upcoming=[];upcomingIndex=0;set('nextLabel','Up Next');set('next','—');set('first','Scores unavailable');set('second','')}finally{busy=false}}refresh();setInterval(refresh,5000)  </script><script src="/live-overlay/voting-clock.js?v=20261026"></script></body></html>
