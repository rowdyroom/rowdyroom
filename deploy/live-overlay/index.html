<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rowdy Room Live Overlay</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}body{font-family:Inter,Arial,sans-serif;color:white}#overlay{position:relative;width:100vw;height:100vh;pointer-events:none}.brand{position:absolute;top:5%;left:4%;padding:.45em .65em;background:rgba(16,5,36,.92);border:2px solid #5de5f1;border-radius:.6em;font-size:clamp(18px,2.7vw,32px);font-weight:900;letter-spacing:.04em}.brand b{color:#5de5f1}.status{position:absolute;top:5%;right:4%;padding:.45em .65em;background:rgba(10,33,23,.92);border-radius:100px;color:#99f6c1;font-size:clamp(12px,1.5vw,18px);font-weight:800}.status.offline{color:#fde68a;background:rgba(44,21,5,.92)}.stage{position:absolute;left:4%;right:4%;bottom:12%;display:grid;gap:.6em}.row,.leaders{display:grid;grid-template-columns:1fr 1fr;gap:.6em}.card{min-width:0;padding:.7em .8em;background:rgba(14,5,31,.92);border:1px solid #8151d6;border-left:.3em solid #5de5f1;border-radius:.7em;box-shadow:0 3px 22px #0009}.standings{border-left-color:#facc15}.label{color:#5de5f1;font-size:clamp(14px,2vw,24px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.standings .label,.leader strong{color:#facc15}.name{font-size:clamp(20px,3.4vw,40px);font-weight:900;line-height:1.2}.song,.leader,.foot{font-size:clamp(13px,2vw,24px);color:#e1d4f2}.name,.song,.leader{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.leader{color:white;font-weight:800}.leader small{color:#e1d4f2;font-size:.75em}.foot{font-size:clamp(11px,1.5vw,18px);margin-top:.2em}
</style></head>
<body><main id="overlay"><div class="brand">THE <b>ROWDY ROOM</b></div><div id="status" class="status offline">CONNECTING</div><section class="stage"><div class="row"><div class="card"><div class="label">Now singing</div><div id="now" class="name">Between singers</div><div id="song" class="song"></div></div><div class="card"><div class="label">Up next</div><div id="next" class="name">Queue open</div><div id="nextSong" class="song"></div></div></div><div class="card standings"><div class="label">Live vote leaders</div><div class="leaders"><div id="first" class="leader">No scores yet</div><div id="second" class="leader"></div></div><div class="foot">Last 12 hours · average / 5 · host controls rotation</div></div></section></main>
<script>
'use strict';const $=id=>document.getElementById(id),set=(id,v)=>{$(id).textContent=v};function nameOf(r){try{let a=Array.isArray(r.singer_names_json)?r.singer_names_json:JSON.parse(r.singer_names_json||'[]');if(a.length)return a.map(String).join(' + ')}catch(e){}return String(r.tiktok_username||'Singer')}async function get(path){let r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(!d.ok)throw Error('Unavailable');return d}let busy=false;async function refresh(){if(busy)return;busy=true;try{let[q,s]=await Promise.all([get('/api/queue'),get('/api/vote/live-standings')]);let rows=Array.isArray(q.queue)?q.queue:[],current=rows.find(x=>x.status==='current'||x.status==='performing'),waiting=rows.filter(x=>['next','waiting','queued'].includes(x.status)).sort((a,b)=>Number(a.position||0)-Number(b.position||0)),next=waiting[0];set('now',current?nameOf(current):'Between singers');set('song',current?String(current.song_title||''):'');set('next',next?nameOf(next):'Queue open');set('nextSong',next?String(next.song_title||''):'');let leaders=Array.isArray(s.standings)?s.standings.slice(0,2):[];for(let i=0;i<2;i++){let el=$(i?'second':'first'),v=leaders[i];el.replaceChildren();if(!v){el.textContent=i?'':'No scores yet';continue}let rank=document.createElement('strong');rank.textContent=(i+1)+'. ';let detail=document.createElement('small');detail.textContent='  '+Number(v.avg_rating||0).toFixed(2)+'/5 · '+Number(v.vote_count||0)+' votes';el.append(rank,document.createTextNode(String(v.singer_name||'Singer')),detail)}$('status').classList.remove('offline');set('status','LIVE DATA')}catch(e){$('status').classList.add('offline');set('status','DATA UNAVAILABLE');set('now','Data unavailable');set('song','');set('next','—');set('nextSong','');set('first','Scores unavailable');set('second','')}finally{busy=false}}refresh();setInterval(refresh,5000)
</script></body></html>
